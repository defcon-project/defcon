[package]
name = "defcon-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeFCoN modern wallet: Tauri shell over defcon-bridge-core. The webview runs the React UI; every Core interaction stays in Rust."

[lib]
name = "defcon_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
defcon-bridge-core = { path = "../bridge-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
