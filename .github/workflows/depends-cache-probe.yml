      A_ID: ${{ needs.baseline_c1_consumer.outputs.cache-id }}
      A_VERSION: ${{ needs.baseline_c1_consumer.outputs.cache-version }}
      A_PREFIX_SHA256: ${{ needs.baseline_c1_consumer.outputs.prefix-sha256 }}
    outputs:
      cache-id: ${{ steps.consume.outputs.cache_id }}
      cache-version: ${{ steps.consume.outputs.cache_version }}
      prefix-sha256: ${{ steps.consume.outputs.prefix_sha256 }}
    steps: *consumer_steps

  baseline_c3_producer:
