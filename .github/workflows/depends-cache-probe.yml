    steps: *consumer_steps

  summary:
    if: always() && github.repository == 'minuszka/defcon-cache-probe-20261016'
    needs: [preflight, baseline_c1_producer, baseline_c1_consumer, baseline_c2_producer, baseline_c2_consumer, baseline_c3_producer, baseline_c3_consumer, baseline_c4_producer, baseline_c4_consumer, fixed_c1_producer, fixed_c1_consumer, fixed_c2_producer, fixed_c2_consumer, fixed_c3_producer, fixed_c3_consumer, fixed_c4_producer, fixed_c4_consumer]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CAMPAIGN_STARTED: ${{ needs.preflight.outputs.started }}
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Collect only small evidence artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/campaign-evidence
      - name: Preserve separate experiment and dependency-contract results
        run: python3 ci/dash/depends_cache_probe.py summary --evidence "$RUNNER_TEMP/campaign-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign-evidence/summary.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
