name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  DOCKER_DRIVER: overlay2
  FAST_MODE: false

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.prepare.outputs.image-tag }}
      repo-name: ${{ steps.prepare.outputs.repo-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare
        id: prepare
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            IMAGE_TAG="latest"
            REPO_NAME=$(echo "${{ github.event.pull_request.base.repo.full_name }}" | tr '[:upper:]' '[:lower:]')
          else
            IMAGE_TAG=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
            REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          fi
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo-name=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./contrib/containers/ci
          file: ./contrib/containers/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:${{ steps.prepare.outputs.image-tag }}
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:latest
          cache-to: type=inline

  build-depends:
    name: Build Dependencies
    needs: build-image
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux64
            host: x86_64-pc-linux-gnu
    container:
      image: ghcr.io/${{ needs.build-image.outputs.repo-name }}/dashcore-ci-runner:${{ needs.build-image.outputs.image-tag }}
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache depends sources
        uses: actions/cache@v4
        with:
          path: |
            depends/sources
          key: depends-sources-${{ hashFiles('depends/packages/*') }}
          restore-keys: |
            depends-sources-

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/${{ matrix.host }}
          key: ${{ runner.os }}-depends-${{ matrix.build_target }}-${{ hashFiles('depends/packages/*') }}
          restore-keys: |
            ${{ runner.os }}-depends-${{ matrix.build_target }}-${{ hashFiles('depends/packages/*') }}
            ${{ runner.os }}-depends-${{ matrix.build_target }}

      - name: Build depends
        run: make -j$(nproc) -C depends HOST=${{ matrix.host }}

  build:
    name: Build
    needs: [build-image, build-depends]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux64
            host: x86_64-pc-linux-gnu
            depends_on: linux64
    container:
      image: ghcr.io/${{ needs.build-image.outputs.repo-name }}/dashcore-ci-runner:${{ needs.build-image.outputs.image-tag }}
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore depends cache
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/${{ matrix.host }}
          key: ${{ runner.os }}-depends-${{ matrix.depends_on }}-${{ hashFiles('depends/packages/*') }}

      - name: Determine PR Base SHA
        id: vars
        run: |
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha || '' }}" >> "$GITHUB_OUTPUT"

      - name: CCache
        uses: actions/cache@v4
        with:
          path: |
            /cache
          key: ${{ runner.os }}-${{ matrix.build_target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build_target }}-${{ github.sha }}
            ${{ runner.os }}-${{ matrix.build_target }}-${{ steps.vars.outputs.PR_BASE_SHA }}
            ${{ runner.os }}-${{ matrix.build_target }}

      - name: Build source and run tests
        run: |
          git config --global --add advice.detachedHead false
          git config --global --add safe.directory "$PWD"
          GIT_HEAD="$(git rev-parse HEAD)"
          git checkout v22.1.x
          git checkout "${GIT_HEAD}"
          CCACHE_SIZE="400M"
          CACHE_DIR="/cache"
          mkdir /output
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          ./ci/dash/build_src.sh
        shell: bash

      # The suites measured green, which is now most of them.
      #
      # This gate used to name eleven, because the test binary died a third of
      # the way through every run: descriptor_tests dereferenced a descriptor
      # this chain's base58 prefixes cannot parse, and key_tests called
      # GetPubKey() on a key those prefixes could not decode, which asserts.
      # 115 of 148 suites had therefore never been executed and nobody could
      # say which were green. With those two fixed the run reaches 83 suites,
      # 70 of them clean, and the gate carries all of them.
      #
      # The list is positive rather than an exclusion list on purpose: the run
      # still stops at net_peer_eviction_tests/peer_eviction_test, so the
      # suites after it are unmeasured, and an exclusion list would put them in
      # the gate untested. Inverting it is the next step, once that hang and
      # the twelve other failing suites are triaged.
      - name: Measured green unit suites
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          cd "build-ci/DeFCoN-${{ matrix.build_target }}"
          make -j"$(nproc)" -C src test/test_defcon
          ./src/test/test_defcon \
            --run_test=addrman_tests,allocator_tests,amount_tests,arith_uint256_tests,banman_tests,base32_tests,base58_tests,base64_tests,bech32_tests,bip32_tests,block_reward_reallocation_tests,blockchain_tests,blockfilter_index_tests,blockfilter_tests,blockmanager_tests,bloom_tests,bls_tests,bswap_tests,cachemap_tests,cachemultimap_tests,checkdatasig_tests,checkqueue_tests,coins_tests,coinstatsindex_tests,collateral_tests,compilerbug_tests,compress_tests,compute_descriptor_tests,crypto_tests,cuckoocache_tests,dbwrapper_tests,dip0020opcodes_tests,dmn_types_tests,dsl_aggregation_tests,dsl_apply_tests,dsl_manager_tests,dsl_probe_tests,dsl_report_store_tests,evo_assetlocks_tests,evo_cbtx_tests,evo_migration_marker_tests,evo_mnauth_tests,evo_mnhf_tests,evo_simplifiedmns_tests,evo_trivialvalidation,flatfile_tests,fs_tests,getarg_tests,governance_vote_sync_tests,hash_tests,header_pow_gate_tests,i2p_tests,interfaces_tests,key_tests,limitedmap_tests,llmq_blockprocessor_tests,llmq_chainlocks_tests,llmq_dkg_tests,llmq_qgetdata_tests,llmq_signing_shares_tests,llmq_snapshot_tests,logging_tests,mempool_tests,merkle_tests,merkleblock_tests,minisketch_tests,mn_dsl_state_tests,multisig_tests,pos_kernel_tests,pos_multiwallet_tests,pos_stake_rules_tests,pose_service_sentinels_tests,pose_service_tests,subsidy_tests,validation_tests \n            --catch_system_errors=no -l test_suite
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.build_target }}
          path: |
            /output
