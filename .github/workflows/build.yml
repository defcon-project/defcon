name: CI

on:
  push:
    branches: [v22.1.x]
    tags: ['v*']
  pull_request:

# A newer push to the same pull request makes the running build pointless.
# Pushes are grouped per commit: GitHub keeps only one pending run per group,
# so a shared group would let the next merge displace a queued release build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  DOCKER_DRIVER: overlay2
  FAST_MODE: false

jobs:
  # A pull request that touches documentation only needs no build. The build jobs
  # below still run, so the required check keeps its name and turns green,
  # but every step in them is skipped. Skipping the jobs themselves would
  # report the matrix job under a different name and leave the required
  # check pending forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Anything besides documentation?
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DOCS='\.md$|^COPYING$|^\.github/ISSUE_TEMPLATE/|^doc/.*\.(txt|png)$'
          # Pushes to the release branch and tags always build: only a pull
          # request may skip, because only there is the base the reviewed one.
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Push event; running the full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PR_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit; running the full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a rename, so a source file moved
          # to a .md name still counts as a code change. -z keeps odd names whole.
          git diff --no-renames --name-only -z "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; tr '\0' '\n' < "$RUNNER_TEMP/changed.txt"
          # grep reads the whole list (no -q), so an early exit cannot turn into
          # a SIGPIPE that pipefail would misread as "documentation only".
          if tr '\0' '\n' < "$RUNNER_TEMP/changed.txt" | grep -v '^$' | grep -vE "$DOCS" > /dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; the build steps are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CI scheduling regressions
        run: python3 ci/dash/test_ci_scheduling.py

  build-image:
    name: Build Image
    needs: changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.prepare.outputs.image-tag }}
      repo-name: ${{ steps.prepare.outputs.repo-name }}
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare
        id: prepare
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            IMAGE_TAG="latest"
            REPO_NAME=$(echo "${{ github.event.pull_request.base.repo.full_name }}" | tr '[:upper:]' '[:lower:]')
          else
            IMAGE_TAG=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
            REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          fi
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo-name=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: needs.changes.outputs.code == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native Linux CI image
        id: native-image
        if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./contrib/containers/ci
          # This workflow's only target is linux64. Cross-build/development
          # tooling remains in the separate full Dockerfile.
          file: ./contrib/containers/ci/Dockerfile.linux64
          push: true
          tags: |
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:${{ steps.prepare.outputs.image-tag }}
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:latest
          cache-to: type=inline

      - name: Resolve the native CI image once
        if: needs.changes.outputs.code == 'true'
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner
          IMAGE_TAG: ${{ steps.prepare.outputs.image-tag }}
          BUILT_DIGEST: ${{ steps.native-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:$IMAGE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="$IMAGE_REPOSITORY@$BUILT_DIGEST"
          fi
          manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          digest="$(jq -er 'if has("manifests") then [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("ambiguous native image") end else .digest end' <<< "$manifest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image-ref=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

  build-depends:
    name: Build Dependencies
    outputs:
      artifact-id: ${{ steps.prefix-upload.outputs.artifact-id }}
      envelope-sha256: ${{ steps.prefix.outputs.envelope_sha256 }}
    needs: [changes, build-image]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux64
            host: x86_64-pc-linux-gnu
    container:
      # Documentation-only runs retain their existing container while all steps skip.
      image: ${{ needs.build-image.outputs.image-ref || format('ghcr.io/{0}/dashcore-ci-runner:{1}', needs.build-image.outputs.repo-name, needs.build-image.outputs.image-tag) }}
      options: --user root
    steps:
      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Trust the checked-out workspace in this container
        if: needs.changes.outputs.code == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Identify dependency inputs before restore
        if: needs.changes.outputs.code == 'true'
        id: identity
        run: python3 ci/dash/depends_prefix.py identity --image "${{ needs.build-image.outputs.image-ref }}" --identity "$RUNNER_TEMP/depends-input.json"

      - name: Cache depends sources
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            depends/sources
          key: depends-sources-v2-${{ runner.os }}-${{ hashFiles('depends/packages/*') }}

      - name: Identify the depends tree and image for cache reuse
        if: needs.changes.outputs.code == 'true'
        id: reuse
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image-ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
          tree="$(git rev-parse --verify HEAD:depends)"
          echo "key=$(printf '%s\n%s\n' "$IMAGE_REF" "$tree" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Cache depends
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            depends/built
            depends/${{ matrix.host }}
          # The exact key binds the cache to every input the producer checks.
          # The fallback reuses an entry for the same depends tree and image
          # made under another workflow or CI script, which would otherwise cost
          # a full depends rebuild: make -C depends keeps each package under its
          # own build id (recipe, dependencies, compilers) and rebuilds the
          # prefix whenever any package differs, so a reused entry is checked by
          # make itself, and with nothing changed the make is a no-op.
          key: depends-v3-${{ runner.os }}-${{ matrix.host }}-${{ steps.reuse.outputs.key }}-${{ steps.identity.outputs.input_sha256 }}
          restore-keys: |
            depends-v3-${{ runner.os }}-${{ matrix.host }}-${{ steps.reuse.outputs.key }}-

      - name: Build depends
        if: needs.changes.outputs.code == 'true'
        run: make -j4 -C depends HOST=${{ matrix.host }}

      - name: Package the current producer prefix
        if: needs.changes.outputs.code == 'true'
        id: prefix
        run: python3 ci/dash/depends_prefix.py pack --image "${{ needs.build-image.outputs.image-ref }}" --identity "$RUNNER_TEMP/depends-input.json" --bundle "$RUNNER_TEMP/depends-prefix"

      - name: Transfer the complete producer prefix
        if: needs.changes.outputs.code == 'true'
        id: prefix-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: depends-prefix-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_target }}-${{ matrix.host }}
          path: ${{ runner.temp }}/depends-prefix/
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 7

  # Three lanes on three runners. runtime builds and runs the unit and Qt
  # suites; functional builds the same tree and runs the functional gate, the
  # longest part, without waiting behind the unit suites; build-options checks
  # the other configurations.
  checks:
    name: Checks
    needs: [changes, build-image, build-depends]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux64
            host: x86_64-pc-linux-gnu
            depends_on: linux64
            lane: runtime
          - build_target: linux64
            host: x86_64-pc-linux-gnu
            depends_on: linux64
            lane: functional
          - build_target: linux64
            host: x86_64-pc-linux-gnu
            depends_on: linux64
            lane: build-options
    # Every shell step must use the directory restored and saved below.
    # In particular, no-wallet used to fall back to ci-cache-linux64/ccache.
    env:
      CACHE_DIR: /cache
      CCACHE_DIR: /cache/ccache
      CCACHE_SIZE: 400M
    container:
      # Documentation-only runs retain their existing container while all steps skip.
      image: ${{ needs.build-image.outputs.image-ref || format('ghcr.io/{0}/dashcore-ci-runner:{1}', needs.build-image.outputs.repo-name, needs.build-image.outputs.image-tag) }}
      options: --user root
    steps:
      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trust the checked-out workspace in this container
        if: needs.changes.outputs.code == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Identify consumer inputs independently
        if: needs.changes.outputs.code == 'true'
        id: identity
        run: python3 ci/dash/depends_prefix.py identity --image "${{ needs.build-image.outputs.image-ref }}" --identity "$RUNNER_TEMP/depends-input.json"

      - name: Check the prefix transport regressions
        if: needs.changes.outputs.code == 'true'
        run: python3 ci/dash/test_depends_prefix.py

      - name: Check detached Windows signing failure handling
        if: needs.changes.outputs.code == 'true'
        run: python3 contrib/windeploy/test_detached_sig_create.py

      - name: Check the macOS SDK helper verifies its inputs
        if: needs.changes.outputs.code == 'true'
        run: python3 contrib/containers/guix/test_setup_sdk.py

      - name: Require one successful producer transfer
        if: needs.changes.outputs.code == 'true'
        env:
          PREFIX_ARTIFACT_ID: ${{ needs.build-depends.outputs.artifact-id }}
          PREFIX_ENVELOPE_SHA256: ${{ needs.build-depends.outputs.envelope-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREFIX_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$PREFIX_ENVELOPE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Download this run's producer prefix
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-depends.outputs.artifact-id }}
          # Exactly one validated ID; unpack its contents directly into path.
          merge-multiple: true
          path: ${{ runner.temp }}/depends-prefix

      - name: Require the producer envelope at the expected download root
        if: needs.changes.outputs.code == 'true'
        run: test -f "$RUNNER_TEMP/depends-prefix/envelope.json"

      - name: Verify and install the current producer prefix
        if: needs.changes.outputs.code == 'true'
        run: python3 ci/dash/depends_prefix.py receive --image "${{ needs.build-image.outputs.image-ref }}" --identity "$RUNNER_TEMP/depends-input.json" --bundle "$RUNNER_TEMP/depends-prefix" --envelope-sha256 "${{ needs.build-depends.outputs.envelope-sha256 }}"

      - name: Determine PR Base SHA
        if: needs.changes.outputs.code == 'true'
        id: vars
        run: |
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha || '' }}" >> "$GITHUB_OUTPUT"

      - name: CCache
        if: needs.changes.outputs.code == 'true' && matrix.lane != 'functional'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /cache
          # Separate writers: the no-wallet cache must not evict or overwrite
          # the runtime lane's entries. The input identity includes the image.
          # The last fallback crosses identities: ccache looks objects up by the
          # compiler, its arguments and the preprocessed source, so an entry made
          # under another workflow, image or depends prefix is a miss, never a
          # wrong object, and a change to this file no longer rebuilds everything.
          key: ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-${{ matrix.lane }}-${{ steps.identity.outputs.input_sha256 }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-${{ matrix.lane }}-${{ steps.identity.outputs.input_sha256 }}-${{ steps.vars.outputs.PR_BASE_SHA }}
            ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-${{ matrix.lane }}-${{ steps.identity.outputs.input_sha256 }}-
            ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-${{ matrix.lane }}-
            ${{ matrix.lane == 'runtime' && format('{0}-{1}-', runner.os, matrix.build_target) || 'no-legacy-build-options-cache-' }}

      # The functional lane compiles exactly what the runtime lane compiles, so
      # it reads that lane's cache and saves none of its own: one writer per
      # build, and no new entries in a cache space that is already full.
      - name: Restore the runtime lane's compiler cache
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'functional'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /cache
          key: ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-runtime-${{ steps.identity.outputs.input_sha256 }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-runtime-${{ steps.identity.outputs.input_sha256 }}-${{ steps.vars.outputs.PR_BASE_SHA }}
            ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-runtime-${{ steps.identity.outputs.input_sha256 }}-
            ccache-v2-${{ runner.os }}-${{ matrix.build_target }}-runtime-

      - name: Prepare the compiler cache
        if: needs.changes.outputs.code == 'true'
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats --max-size="$CCACHE_SIZE"

      - name: Prepare the build-options source
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'build-options'
        run: ./autogen.sh

      - name: Build source and run tests
        if: needs.changes.outputs.code == 'true' && (matrix.lane == 'runtime' || matrix.lane == 'functional')
        run: |
          git config --global --add advice.detachedHead false
          git config --global --add safe.directory "$PWD"
          GIT_HEAD="$(git rev-parse HEAD)"
          git checkout v22.1.x
          git checkout "${GIT_HEAD}"
          mkdir /output
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          ./ci/dash/build_src.sh
        shell: bash

      - name: Configure option regressions
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'build-options'
        run: |
          configure_tests="$(mktemp -d)/configure-tests"
          python3 test/configure/test_configure.py \
            --prefix="$PWD/depends/${{ matrix.host }}" \
            --output-dir="$configure_tests"
          make -j4 -C "$configure_tests/lcov-default/src" bls/libbitcoin_consensus_a-bls.o
          make -j4 -C "$configure_tests/library-only"
        shell: bash

      - name: No-wallet build and RPC/PoS regressions
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'build-options'
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          source_dir="$PWD"
          # Stable within each fresh job, so debug-info paths do not make the
          # persisted compiler cache miss on every subsequent workflow run.
          nowallet_build="$RUNNER_TEMP/no-wallet"
          mkdir "$nowallet_build"
          cd "$nowallet_build"
          "$source_dir/configure" \
            --enable-suppress-external-warnings --disable-dependency-tracking \
            --prefix="$DEPENDS_DIR/$HOST" $BITCOIN_CONFIG --disable-wallet
          make -j4 all
          make -j4 -C src test/test_defcon qt/test/test_defcon-qt
          ./src/test/test_defcon \
            --run_test=crypto_tests,hash_tests,pos_kernel_tests,pos_coinbase_bound_tests,pos_reorg_maturity_tests,pos_coinstake_fee_tests,pos_dirty_index_tests \
            --catch_system_errors=no -l test_suite
          QT_QPA_PLATFORM=minimal XDG_CONFIG_HOME="$(mktemp -d)" ./src/qt/test/test_defcon-qt
          python3 "$source_dir/test/functional/rpc_bls.py" \
            --configfile="$nowallet_build/test/config.ini" --timeout-factor="$TEST_RUNNER_TIMEOUT_FACTOR"
        shell: bash

      # Every unit suite runs; the exceptions are named, with the reason.
      #
      # This was an allowlist of eleven, because the test binary died partway
      # through every run and 115 of 148 suites had never been executed. Four
      # inherited tests were killing it, all of them expecting a value this
      # fork changed: descriptor_tests dereferenced a descriptor whose xprv
      # prefix no longer decodes, key_tests called GetPubKey() on a key its
      # WIF prefix could not decode, net_peer_connection_tests waited for a log
      # line naming port 9999 where this chain uses 8192, and pow_tests handed
      # a heightless chain to a difficulty rule that walks by height. With
      # those fixed the run completes: 148 suites, 722 cases, 692 of them
      # green.
      #
      # So the gate is inverted. A suite added tomorrow is gated the day it
      # lands, and dropping one takes a line here that says why. The ones
      # below still fail, each for a reason visible for the first time now that
      # they run at all:
      #
      #   base58 identity, like the four above:  descriptor_tests, key_io_tests
      #   serialization this fork changed:       blockencodings_tests
      #   long mining loops that no longer mine: dynamic_activation_thresholds_tests
      #
      # miner_tests is excluded by CASE, not by suite. It holds two: the
      # inherited CreateNewBlock_validity, a long mining loop that no longer
      # mines, and this fork's own
      # check_block_signature_survives_an_unsolvable_coinstake, which passes and
      # guards a remotely reachable abort -- CheckBlock runs the block signature
      # ahead of the merkle root, and a proof-of-stake block is never asked for
      # proof of work, so an unsolvable coinstake script reaches the empty
      # Solver result from any peer. Excluding the suite dropped that guard from
      # CI along with the failure it was named for. Measured on the whole gate:
      # 627 cases before, 628 after, the gained one being exactly that case, and
      # the run still green.
      #
      # evo_dip3_activation_tests came off this list once its two failures were
      # read rather than assumed. It was filed under the long mining loops and
      # runs in eight seconds; one fixture spent a masternode collateral a block
      # after registering it, which the maturity rule correctly refuses, and the
      # other planted its corruption under a database key a format migration had
      # renamed, so it corrupted nothing and then reported the verifier for
      # missing it. Neither was a defect in the code they accused.
      #
      # validation_chainstatemanager_tests came off once the regtest assumeutxo
      # value for height 110 stopped being Dash's: a correct snapshot of this
      # chain was being refused.
      #   still to triage:                       bip324_tests, bip39_tests,
      #                                          denialofservice_tests, evo_utils_tests,
      #                                          governance_validators_tests, rpc_tests,
      #                                          transaction_tests, util_tests,
      #                                          validation_chainstate_tests,
      #                                          wallet_tests
      - name: Unit suites (all but the named exceptions)
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'runtime'
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          cd "build-ci/DeFCoN-${{ matrix.build_target }}"
          make -j"$(nproc)" -C src test/test_defcon
          ./src/test/test_defcon \
            --run_test='!bip324_tests:!bip39_tests:!blockencodings_tests:!denialofservice_tests:!descriptor_tests:!dynamic_activation_thresholds_tests:!evo_utils_tests:!governance_validators_tests:!key_io_tests:!miner_tests/CreateNewBlock_validity:!rpc_tests:!transaction_tests:!util_tests:!validation_chainstate_tests:!wallet_tests' \
            --catch_system_errors=no -l test_suite
        shell: bash

      # Run every compiled Qt suite, including future additions.
      - name: Qt tests and leak check
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'runtime'
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          cd "build-ci/DeFCoN-${BUILD_TARGET}"
          # GCC 11 LSan reserves 0x600000000000..0x640000000000.
          # A randomized PIE test executable can overlap that reservation and
          # crash in the loader before main. Relink only this test executable;
          # keep the daemon, wallet and CLI binaries byte-for-byte unchanged.
          sha256sum src/defcond src/defcon-cli src/qt/defcon-qt > production-before-lsan.sha256
          rm -f src/qt/test/test_defcon-qt
          make V=1 -j"$(nproc)" -C src qt/test/test_defcon-qt \
            'qt_test_test_defcon_qt_LDFLAGS=$(LDFLAGS_WRAP_EXCEPTIONS) $(RELDFLAGS) $(AM_LDFLAGS) $(QT_LDFLAGS) $(LIBTOOL_APP_LDFLAGS) $(PTHREAD_FLAGS) -no-pie'
          readelf -h src/qt/test/test_defcon-qt | grep -E 'Type: +EXEC '
          readelf -lW src/qt/test/test_defcon-qt
          sha256sum -c production-before-lsan.sha256
          export QT_QPA_PLATFORM=minimal
          export XDG_CONFIG_HOME="$(mktemp -d)"
          trap 'rm -rf "$XDG_CONFIG_HOME"' EXIT
          ./src/qt/test/test_defcon-qt
          LSAN_RUNTIME="$(gcc -print-file-name=liblsan.so)"
          test -f "$LSAN_RUNTIME"
          readlink -f "$LSAN_RUNTIME"
          sha256sum "$LSAN_RUNTIME"
          # Do not inherit the generic libQt5Widgets suppression: it would
          # hide the table-item leak these cases are meant to catch.
          LSAN_OPTIONS=exitcode=23 LD_PRELOAD="$LSAN_RUNTIME" \
            ./src/qt/test/test_defcon-qt --suite=MasternodeListTests \
              repeatedFiltering filteredRowsKeepOrderAndIdentity
          # Prove that this runtime detects leaks in this Qt executable.
          # Keep the intentional leak confined to a separate preload/run.
          # Use a large allocation: the old 12345-byte allocation landed at
          # 0x627000000000, which pairs of 32-bit stack-depot IDs in liblsan
          # could accidentally mark reachable during conservative scanning.
          cat > "$XDG_CONFIG_HOME/lsan-canary.c" <<'C'
          #include <stdlib.h>
          __attribute__((constructor, noinline)) static void lsan_canary(void)
          {
              void *leak = malloc(1234567);
              __asm__ volatile("" : : "r"(leak) : "memory");
          }
          C
          gcc -shared -fPIC -O0 -g -o "$XDG_CONFIG_HOME/lsan-canary.so" \
            "$XDG_CONFIG_HOME/lsan-canary.c"
          canary_status=0
          LSAN_OPTIONS=exitcode=23 LD_PRELOAD="$LSAN_RUNTIME:$XDG_CONFIG_HOME/lsan-canary.so" \
            ./src/qt/test/test_defcon-qt --suite=MasternodeListTests \
              repeatedFiltering filteredRowsKeepOrderAndIdentity \
              > "$XDG_CONFIG_HOME/lsan-canary.log" 2>&1 || canary_status=$?
          cat "$XDG_CONFIG_HOME/lsan-canary.log"
          if [[ "$canary_status" -ne 23 ]] || \
             ! grep -F 'Direct leak of 1234567 byte(s) in 1 object(s)' "$XDG_CONFIG_HOME/lsan-canary.log"; then
            echo "LSan canary failed: expected the injected leak and exit 23, got $canary_status"
            exit 1
          fi
        shell: bash

      # Functional tests: a named gate, not the whole runner. The list, what
      # each entry guards and why the other registered tests stay out are in
      # ci/dash/functional_gate.txt.
      #
      # ci/dash/functional_gate.py checks the list before anything runs. A name
      # the runner cannot resolve is only a WARNING there, and the step would
      # stay green while that test silently stopped running -- the very failure
      # mode feature_llmq_q60_proto_floor.py lived in until the gate registered
      # it. The check applies the runner's own rule (a prefix match against
      # ALL_SCRIPTS) rather than a grep of the file, so it cannot drift from what
      # the runner does; its failure ends the step explicitly, not only through
      # the shell's -e. It then prints the tests longest first by their recorded
      # seconds, the order test_runner.py starts them in.
      #
      # --ci is not passed: it turns the runner's "script not in any list"
      # warning into exit 1, and the three scale tests the list names are kept
      # out of the runner's lists on purpose. The runner exits non-zero when any
      # listed test fails, so the job fails with it. --combinedlogslen prints a
      # failing test's combined node log into this job's output, the only place
      # it can be read from afterwards, and the timeout factor is the house value
      # from ci/test/00_setup_env.sh. No retries and no --failfast: a flaky entry
      # has to be seen, and one red run should name every failing test. The
      # seconds each test took go to the run summary next to the recorded ones;
      # that report cannot change the step's result.
      - name: Functional tests (named gate)
        id: functional
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'functional'
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          gate="$RUNNER_TEMP/functional-gate.txt"
          python3 ci/dash/functional_gate.py order > "$gate" || exit 1
          mapfile -t GATE < "$gate"
          echo "gate: ${#GATE[@]} tests, longest first: ${GATE[*]}"
          log="$RUNNER_TEMP/functional-gate.log"
          cd "build-ci/DeFCoN-${BUILD_TARGET}"
          nproc
          python3 --version
          status=0
          python3 test/functional/test_runner.py --jobs=4 --timeout-factor="${TEST_RUNNER_TIMEOUT_FACTOR}" --combinedlogslen=4000 --tmpdirprefix="$RUNNER_TEMP/functional-tests" "${GATE[@]}" 2>&1 | tee "$log" || status=$?
          python3 "$GITHUB_WORKSPACE/ci/dash/functional_gate.py" report "$log" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::the functional gate duration report failed"
          exit "$status"
        shell: bash

      - name: Upload failed functional test directories
        if: ${{ failure() && steps.functional.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-functional-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_target }}-${{ matrix.host }}
          path: ${{ runner.temp }}/functional-tests/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload build artifacts
        if: needs.changes.outputs.code == 'true' && matrix.lane == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.build_target }}
          path: |
            /output

      - name: Report compiler cache statistics
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          {
            echo '### Compiler cache'
            echo "Directory: $CCACHE_DIR"
            echo '```text'
            ccache --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Every fuzz target runs once over its saved inputs (ci/dash/fuzz_regression.sh). Only for
  # code changes. Informational for its first weeks: a failure fails this job and shows on the
  # pull request, but the required check below neither waits for it nor reads it, and the
  # branch requires only that one. No compiler cache: the repository's cache space is already
  # full, and a sanitizer build would evict the main build's.
  fuzz:
    name: Fuzz regression (linux64_fuzz)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the fuzz build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 libclang-rt-18-dev llvm-18 autoconf automake libtool pkg-config bsdmainutils \
            libevent-dev libgmp-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-thread-dev libboost-test-dev

      - name: Build the fuzz binary
        run: ci/dash/fuzz_regression.sh build

      - name: Fetch the seed corpus
        run: ci/dash/fuzz_regression.sh corpus "$RUNNER_TEMP/fuzz-corpus"

      - name: Run every fuzz target once
        run: ci/dash/fuzz_regression.sh run "$RUNNER_TEMP/fuzz-corpus"

  # Keep the existing required check name. A successful runtime lane alone
  # cannot authorize a merge when build-options failed, skipped or cancelled.
  build:
    name: Build (linux64, x86_64-pc-linux-gnu, linux64)
    if: ${{ always() }}
    needs: [changes, build-image, build-depends, checks]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every CI lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS_JSON'])
          required = {'changes', 'build-image', 'build-depends', 'checks'}
          if set(needs) != required:
              sys.exit('CI prerequisites are missing or unexpected')
          failed = [name for name in sorted(required) if needs[name]['result'] != 'success']
          if failed:
              sys.exit('CI prerequisites did not succeed: ' + ', '.join(failed))
          if needs['changes']['outputs'].get('code') not in ('true', 'false'):
              sys.exit('Change detection did not produce a valid decision')
          print('All required CI lanes succeeded')
          PY
