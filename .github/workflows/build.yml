name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  DOCKER_DRIVER: overlay2
  FAST_MODE: false

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.prepare.outputs.image-tag }}
      repo-name: ${{ steps.prepare.outputs.repo-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare
        id: prepare
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            IMAGE_TAG="latest"
            REPO_NAME=$(echo "${{ github.event.pull_request.base.repo.full_name }}" | tr '[:upper:]' '[:lower:]')
          else
            IMAGE_TAG=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
            REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          fi
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo-name=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./contrib/containers/ci
          file: ./contrib/containers/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:${{ steps.prepare.outputs.image-tag }}
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-ci-runner:latest
          cache-to: type=inline

  build-depends:
    name: Build Dependencies
    needs: build-image
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux64
            host: x86_64-pc-linux-gnu
    container:
      image: ghcr.io/${{ needs.build-image.outputs.repo-name }}/dashcore-ci-runner:${{ needs.build-image.outputs.image-tag }}
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache depends sources
        uses: actions/cache@v4
        with:
          path: |
            depends/sources
          key: depends-sources-${{ hashFiles('depends/packages/*') }}
          restore-keys: |
            depends-sources-

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/${{ matrix.host }}
          key: ${{ runner.os }}-depends-${{ matrix.build_target }}-${{ hashFiles('depends/packages/*') }}
          restore-keys: |
            ${{ runner.os }}-depends-${{ matrix.build_target }}-${{ hashFiles('depends/packages/*') }}
            ${{ runner.os }}-depends-${{ matrix.build_target }}

      - name: Build depends
        run: make -j$(nproc) -C depends HOST=${{ matrix.host }}

  build:
    name: Build
    needs: [build-image, build-depends]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux64
            host: x86_64-pc-linux-gnu
            depends_on: linux64
    container:
      image: ghcr.io/${{ needs.build-image.outputs.repo-name }}/dashcore-ci-runner:${{ needs.build-image.outputs.image-tag }}
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore depends cache
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/${{ matrix.host }}
          key: ${{ runner.os }}-depends-${{ matrix.depends_on }}-${{ hashFiles('depends/packages/*') }}

      - name: Determine PR Base SHA
        id: vars
        run: |
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha || '' }}" >> "$GITHUB_OUTPUT"

      - name: CCache
        uses: actions/cache@v4
        with:
          path: |
            /cache
          key: ${{ runner.os }}-${{ matrix.build_target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build_target }}-${{ github.sha }}
            ${{ runner.os }}-${{ matrix.build_target }}-${{ steps.vars.outputs.PR_BASE_SHA }}
            ${{ runner.os }}-${{ matrix.build_target }}

      - name: Build source and run tests
        run: |
          git config --global --add advice.detachedHead false
          git config --global --add safe.directory "$PWD"
          GIT_HEAD="$(git rev-parse HEAD)"
          git checkout v22.1.x
          git checkout "${GIT_HEAD}"
          CCACHE_SIZE="400M"
          CACHE_DIR="/cache"
          mkdir /output
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          ./ci/dash/build_src.sh
        shell: bash

      # Every unit suite runs; the exceptions are named, with the reason.
      #
      # This was an allowlist of eleven, because the test binary died partway
      # through every run and 115 of 148 suites had never been executed. Four
      # inherited tests were killing it, all of them expecting a value this
      # fork changed: descriptor_tests dereferenced a descriptor whose xprv
      # prefix no longer decodes, key_tests called GetPubKey() on a key its
      # WIF prefix could not decode, net_peer_connection_tests waited for a log
      # line naming port 9999 where this chain uses 8192, and pow_tests handed
      # a heightless chain to a difficulty rule that walks by height. With
      # those fixed the run completes: 148 suites, 722 cases, 692 of them
      # green.
      #
      # So the gate is inverted. A suite added tomorrow is gated the day it
      # lands, and dropping one takes a line here that says why. The seventeen
      # below still fail, each for a reason visible for the first time now that
      # they run at all:
      #
      #   base58 identity, like the four above:  descriptor_tests, key_io_tests
      #   serialization this fork changed:       blockencodings_tests
      #   long mining loops that no longer mine: dynamic_activation_thresholds_tests
      #
      # miner_tests is excluded by CASE, not by suite. It holds two: the
      # inherited CreateNewBlock_validity, a long mining loop that no longer
      # mines, and this fork's own
      # check_block_signature_survives_an_unsolvable_coinstake, which passes and
      # guards a remotely reachable abort -- CheckBlock runs the block signature
      # ahead of the merkle root, and a proof-of-stake block is never asked for
      # proof of work, so an unsolvable coinstake script reaches the empty
      # Solver result from any peer. Excluding the suite dropped that guard from
      # CI along with the failure it was named for. Measured on the whole gate:
      # 627 cases before, 628 after, the gained one being exactly that case, and
      # the run still green.
      #
      # evo_dip3_activation_tests came off this list once its two failures were
      # read rather than assumed. It was filed under the long mining loops and
      # runs in eight seconds; one fixture spent a masternode collateral a block
      # after registering it, which the maturity rule correctly refuses, and the
      # other planted its corruption under a database key a format migration had
      # renamed, so it corrupted nothing and then reported the verifier for
      # missing it. Neither was a defect in the code they accused.
      #   still to triage:                       bip324_tests, bip39_tests,
      #                                          denialofservice_tests, evo_utils_tests,
      #                                          governance_validators_tests, rpc_tests,
      #                                          transaction_tests, util_tests,
      #                                          validation_chainstate_tests,
      #                                          validation_chainstatemanager_tests,
      #                                          wallet_tests
      - name: Unit suites (all but the named exceptions)
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          cd "build-ci/DeFCoN-${{ matrix.build_target }}"
          make -j"$(nproc)" -C src test/test_defcon
          ./src/test/test_defcon \
            --run_test='!bip324_tests:!bip39_tests:!blockencodings_tests:!denialofservice_tests:!descriptor_tests:!dynamic_activation_thresholds_tests:!evo_utils_tests:!governance_validators_tests:!key_io_tests:!miner_tests/CreateNewBlock_validity:!rpc_tests:!transaction_tests:!util_tests:!validation_chainstate_tests:!validation_chainstatemanager_tests:!wallet_tests' \
            --catch_system_errors=no -l test_suite
        shell: bash

      # Functional tests: a named gate, not the whole runner.
      #
      # Until this step existed the workflow ran zero functional tests. The
      # inherited ci/dash/test_integrationtests.sh is never called from here
      # (and it still cds into build-ci/dashcore-*, a directory this tree does
      # not produce), so every regression that only test/functional covers --
      # proof-of-stake, the evodb recovery, the Q60 switchover, the Sentinel
      # layer, the peer protocol -- was guarded by hand. Two defects lived
      # under a green CI because of it: feature_llmq_chainlocks.py failed
      # with a TypeError on the tip for months (#226), and a new log category
      # aborted the node at its first line (#228).
      #
      # The list is explicit and every entry says what it guards, so dropping
      # one takes a line here that says why. It is ordered longest first, the
      # way test_runner.py orders its own list, so that the five-minute
      # chainlocks run is not the last one to start. Registered tests that
      # stay out, each with the measured reason (this binary, four CPUs,
      # --jobs=4):
      #   feature_llmq_q60_switchover.py, feature_llmq_q60_dkg.py and
      #   feature_dsl_enforcement_scale.py run 66 daemons each, raise
      #   TEST_RUNNER_MAX_NODES themselves and would collide with the port
      #   stride of a parallel runner -- which is also why they are kept out
      #   of test_runner.py's lists;
      #   feature_dsl_scenarios.py: 261 s, seven masternodes and a quorum
      #   under injected faults, on its own nearly another chainlocks run;
      #   feature_dsl_enforcement.py: 83 s, seven masternodes, the punishing
      #   branch behind -testactivationheight=dslenforcement;
      #   feature_dsl_faults.py: 71 s, seven masternodes with faults injected
      #   into a running node;
      #   feature_dsl_fault_injection.py: 9 s and two daemons, kept out
      #   because it tests the fault injector itself, a lab instrument the
      #   node refuses to start with outside regtest and devnet;
      #   rpc_getblockstats.py: an inherited failure, its fixture assumes
      #   Dash's subsidy;
      # From the same Sentinel layer the gate carries feature_dsl_service.py
      # (38 s; the test that caught #228), feature_dsl_commit_decision_log.py
      # and feature_dsl_commitment_v2.py: the probe, the producer's decision
      # and the second bitfield, all live on the devnet.
      #
      # feature_dsl_commitment_v2.py was measured out of this gate once, and
      # the measurement was right at the time: alone it passed three runs out
      # of three, and in this company (--jobs=4 beside the chainlocks and
      # staking runs) it failed three out of three. What it was failing on was
      # not the runner but the node -- a receiver dropped an announcement that
      # arrived more than one block ahead of the epoch base, which under load
      # is where the announcements are -- and that is now fixed (#235). Two
      # halves of one lesson: a red gate on a timing race teaches people to
      # ignore red, and a test that only fails under load can be reporting a
      # defect that only appears under load. Re-measured on the fix, same four
      # CPUs and the same list: three runs out of three green, the test itself
      # 88/80/81 s, the whole gate 344/328/327 s wall.
      #
      # --ci is not passed: it turns the runner's "script not in any list"
      # warning into exit 1, and the three scale tests above are kept out of
      # the lists on purpose. The runner exits non-zero when any listed test
      # fails, so the job fails with it. A bare name runs every registered
      # variant of it (feature_pos_staking.py is --descriptors and
      # --legacy-wallet), --combinedlogslen prints a failing test's combined
      # node log into this job's output, the only place it can be read from
      # afterwards, and the timeout factor is the house value from
      # ci/test/00_setup_env.sh. No retries and no --failfast: a flaky entry
      # has to be seen, and one red run should name every failing test.
      #
      # The gate checks its own list before running it. A name the runner
      # cannot resolve is only a WARNING there, and the step would stay green
      # while that test silently stopped running -- the very failure mode
      # feature_llmq_q60_proto_floor.py lived in until this gate registered
      # it. The check applies the runner's own rule (a prefix match against
      # ALL_SCRIPTS) rather than a grep of the file, so it cannot drift from
      # what the runner does; its failure ends the step explicitly, not
      # only through the shell's -e.
      - name: Functional tests (named gate)
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ matrix.build_target }}"
          source ./ci/dash/matrix.sh
          export LD_LIBRARY_PATH="$DEPENDS_DIR/$HOST/lib"
          cd "build-ci/DeFCoN-${BUILD_TARGET}"
          nproc
          python3 --version
          GATE=(
            feature_llmq_chainlocks.py             # ChainLocks, with a masternode added dynamically
            feature_pos_staking.py                 # real proof-of-stake blocks on regtest; descriptor and legacy wallet
            feature_pos_verifychain.py             # R-03: verifychain at level 4 on a proof-of-stake chain, and the indexed restart it gates
            feature_dsl_commitment_v2.py           # the Sentinel commitment's second bitfield: who the pool judged at all (#231)
            feature_addressindex_coinstake.py      # the address index's mature/immature split on a coinstake (#221)
            p2p_instantsend.py                     # InstantSend: the unconfirmed double spend is refused
            rpc_verifyislock.py                    # the lock-verifying RPCs
            feature_dsl_service.py                 # the Sentinel probe end to end: announcements flood, reports pool, a stopped node is reported MISSED
            feature_llmq_is_nonrotation.py         # an InstantSend lock on a quorum that does not rotate
            feature_llmq_q60_proto_floor.py        # the peer protocol floor from the formation lead, against the real predecessor version
            feature_evodb_reconcile.py             # an evodb that stopped short of the coins tip is rebuilt at startup, with its log line
            rpc_verifychainlock.py                 # the lock-verifying RPCs
            feature_evodb_reconcile_below_dip3.py  # the same below DIP0003, where an empty evodb is current
            feature_llmq_q60_regtest.py            # the Q60 ChainLock profile (llmq_defcon) on regtest
            feature_llmq_switchover_config.py      # the startup guards on the Q60 switchover heights, the v23@N alias
            p2p_headers_uncompressed.py            # the plain headers reader consumes what every writer writes (#220)
            feature_dsl_commit_decision_log.py     # the producer's Sentinel commit decision without a commitment (F-2026-140)
          )
          python3 - "${GATE[@]}" <<'PY' || exit 1
          import sys
          sys.path.insert(0, 'test/functional')
          import test_runner
          missing = [t for t in sys.argv[1:] if not any(s.startswith(t) for s in test_runner.ALL_SCRIPTS)]
          if missing:
              sys.exit("gate entries not registered in test_runner.py: " + ", ".join(missing))
          print("gate: every entry is registered in test_runner.py (%d names)" % len(sys.argv[1:]))
          PY
          python3 test/functional/test_runner.py --jobs=4 --timeout-factor="${TEST_RUNNER_TIMEOUT_FACTOR}" --combinedlogslen=4000 "${GATE[@]}"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.build_target }}
          path: |
            /output
